name: Deploy ELITE iPhone PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/deploy-ios-pwa.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elite-ios-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ios

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
